[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-analyst-agents"
version = "0.1.0"
description = "Мультиагентная система анализа отдела продаж: amoCRM + записи звонков + LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "langgraph>=0.4",
    "langchain-anthropic>=1.1",  # with_structured_output(method="json_schema")
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sales-analyst = "sales_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_analyst = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
